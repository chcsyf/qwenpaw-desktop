<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>远程桌面 v0.1.1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #screen { position: absolute; inset: 0; }
  #screen canvas { display: block; }

  /* ---- 连接状态 ---- */
  #status {
    position: absolute; top: 8px; right: 10px; z-index: 70;
    background: rgba(13,17,23,.72); color: #8b949e;
    padding: 4px 10px; border-radius: 6px; font-size: 12px;
    pointer-events: none; border: 1px solid rgba(48,54,61,.6);
  }
  #status.on { color: #3fb950; }

  /* ---- 快捷入口层（右下角竖排，位于工具按钮上方） ---- */
  #dock {
    position: absolute; right: 8px; bottom: 54px; z-index: 50;
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 5px;
    background: rgba(13,17,23,.68);
    border: 1px solid rgba(48,54,61,.5);
    border-radius: 10px;
    backdrop-filter: blur(3px);
  }
  .sc {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    width: 54px; padding: 4px 2px; border-radius: 8px;
    cursor: pointer; user-select: none; border: 1px solid transparent;
    transition: background .15s;
  }
  .sc:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); }
  .sc img { width: 26px; height: 26px; border-radius: 5px; object-fit: contain; }
  .sc span { color: #e6edf3; font-size: 10px; text-shadow: 0 1px 3px rgba(0,0,0,.9); line-height: 1.1; }
  .sc .glyph { width: 26px; height: 26px; border-radius: 5px; background: #21262d; color: #e6edf3; display: flex; align-items: center; justify-content: center; font-size: 15px; }

  /* ---- 右下工具 ---- */
  #tools {
    position: absolute; right: 10px; bottom: 10px; z-index: 70;
    display: flex; gap: 6px;
  }
  .tb {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(22,27,34,.85); color: #e6edf3;
    border: 1px solid #30363d; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .tb:hover { background: #21262d; }
  .tb.active { background: #21262d; border-color: #3fb950; }

  /* ---- 粘贴板面板 ---- */
  #clipPanel {
    position: absolute; right: 10px; bottom: 56px; z-index: 75;
    width: 340px; max-height: 300px;
    background: rgba(22,27,34,.96); border: 1px solid #30363d;
    border-radius: 10px; display: none; flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); overflow: hidden;
  }
  #clipPanel .cp-head {
    padding: 8px 12px 4px; font-size: 12px; color: #e6edf3;
    border-bottom: 1px solid #30363d; background: rgba(1,4,9,.4);
  }
  #clipPanel .cp-tips {
    padding: 4px 12px 6px; border-bottom: 1px solid #30363d;
    background: rgba(1,4,9,.25);
  }
  #clipPanel .cp-tips div {
    color: #8b949e; font-size: 10px; line-height: 1.7;
  }
  #clipPanel .cp-edit { padding: 6px 10px; border-bottom: 1px solid #30363d; }
  #clipPanel .cp-edit textarea {
    width: 100%; box-sizing: border-box; resize: none;
    background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none;
    min-height: 30px; max-height: 80px; overflow-y: auto;
    font-family: inherit; line-height: 1.6;
  }
  #clipPanel .cp-edit textarea:focus { border-color: #3fb950; }
  #clipPanel .cp-list { overflow-y: auto; max-height: 190px; }
  #clipPanel .cp-list::-webkit-scrollbar,
  #clipPanel .cp-edit textarea::-webkit-scrollbar {
    width: 8px; height: 8px;
  }
  #clipPanel .cp-list::-webkit-scrollbar-track,
  #clipPanel .cp-edit textarea::-webkit-scrollbar-track {
    background: transparent;
  }
  #clipPanel .cp-list::-webkit-scrollbar-thumb,
  #clipPanel .cp-edit textarea::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2); border-radius: 4px;
  }
  #clipPanel .cp-list::-webkit-scrollbar-thumb:hover,
  #clipPanel .cp-edit textarea::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.3);
  }
  #clipPanel .cp-list::-webkit-scrollbar-corner,
  #clipPanel .cp-edit textarea::-webkit-scrollbar-corner {
    background: transparent;
  }
  #clipPanel .cp-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer; border-bottom: 1px solid rgba(48,54,61,.5);
  }
  #clipPanel .cp-item:hover { background: #21262d; }
  #clipPanel .cp-src {
    flex-shrink: 0; font-size: 10px; padding: 2px 6px; border-radius: 4px;
  }
  #clipPanel .cp-src.remote { background: rgba(63,185,80,.15); color: #3fb950; }
  #clipPanel .cp-src.local { background: rgba(88,166,255,.15); color: #58a6ff; }
  #clipPanel .cp-text {
    flex: 1; font-size: 12px; color: #e6edf3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.5;
  }
  #clipPanel .cp-empty {
    padding: 16px 12px; text-align: center; color: #8b949e; font-size: 12px;
  }

  #kbInput { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* 提示 toast */
  #toast {
    position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: rgba(217,58,73,.95); color: #fff; padding: 6px 14px;
    border-radius: 6px; font-size: 12px; z-index: 90; display: none;
    max-width: 80%; text-align: center;
  }

  /* ---- 截图预览弹窗 ---- */
  #shotModal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(1,4,9,.82);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
  }
  #shotModal .shot-box {
    max-width: 92vw; max-height: 78vh;
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 10px; overflow: auto;
  }
  #shotModal img { display: block; max-width: 90vw; max-height: 70vh; }
  #shotModal .shot-actions { display: flex; gap: 8px; }
  #shotModal button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer;
  }
  #shotModal button:hover { background: #30363d; }
  #shotModal button.primary { background: #238636; border-color: #2ea043; }
  #shotModal button.primary:hover { background: #2ea043; }

  /* ---- 关闭桌面确认弹窗 ---- */
  #closeModal {
    position: fixed; inset: 0; z-index: 210;
    background: rgba(1,4,9,.82);
    display: none; align-items: center; justify-content: center;
  }
  #closeModal .close-box {
    width: 320px;
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 20px 24px 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #closeModal .close-title {
    color: #e6edf3; font-size: 15px; font-weight: 600; margin-bottom: 8px;
  }
  #closeModal .close-desc {
    color: #8b949e; font-size: 12px; line-height: 1.6; margin-bottom: 18px;
  }
  #closeModal .close-actions { display: flex; justify-content: flex-end; gap: 8px; }
  #closeModal .close-actions button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 6px 16px; font-size: 12px; cursor: pointer;
  }
  #closeModal .close-actions button:hover { background: #30363d; }
  #closeModal .close-actions button.danger { background: #da3633; border-color: #da3633; color: #fff; }
  #closeModal .close-actions button.danger:hover { background: #f85149; }

  /* ---- 分辨率菜单 ---- */
  #resMenu {
    position: absolute; right: 10px; bottom: 56px; z-index: 80;
    display: none; flex-direction: column; gap: 2px;
    padding: 6px; min-width: 150px;
    background: rgba(22,27,34,.95);
    border: 1px solid #30363d; border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
  }
  #resMenu .res-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px;
    color: #e6edf3; font-size: 12px; cursor: pointer;
    border: 1px solid transparent;
  }
  #resMenu .res-item:hover { background: rgba(255,255,255,.1); }
  #resMenu .res-item.cur { color: #3fb950; }
  #resMenu .res-item .mark { width: 14px; text-align: center; flex-shrink: 0; }
  #resMenu .res-label { flex: 1; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="status">连接中…</div>

<!-- 快捷入口层 -->
<div id="dock">
  <div class="sc" data-app="https://github.com"><img src="/api/qwenpaw-desktop/icon?name=github" alt=""><span>GitHub</span></div>
  <div class="sc" data-app="https://www.google.com"><img src="/api/qwenpaw-desktop/icon?name=google" alt=""><span>Google</span></div>
  <div class="sc" data-app="https://www.bing.com"><img src="/api/qwenpaw-desktop/icon?name=bing" alt=""><span>Bing</span></div>
  <div class="sc" data-app="https://www.baidu.com"><img src="/api/qwenpaw-desktop/icon?name=baidu" alt=""><span>百度</span></div>
  <div class="sc" data-app="__terminal__"><span class="glyph">❯_</span><span>终端</span></div>
  <div class="sc" data-app="__files__"><span class="glyph">📁</span><span>文件</span></div>
</div>

<!-- 右下工具 -->
<div id="tools" style="display:none">
  <button class="tb" id="btnDock" title="快捷入口">☰</button>
  <button class="tb" id="btnRes" title="分辨率">🖥</button>
  <button class="tb" id="btnShot" title="截图当前桌面">📷</button>
  <button class="tb" id="btnPaste" title="打开粘贴板">📋</button>
  <button class="tb" id="btnReload" title="重新连接">⟳</button>
  <button class="tb" id="btnClose" title="关闭桌面">⏻</button>
</div>

<!-- 粘贴板面板 -->
<div id="clipPanel">
  <div class="cp-head">粘贴板</div>
  <div class="cp-tips">
    <div>· 远端复制自动加入粘贴板</div>
    <div>· 点击条目自动复制到本地粘贴板并移动到粘贴板第一条</div>
    <div>· 本地复制自动读入到粘贴板</div>
    <div>· 桌面内 Ctrl+V 默认填入粘贴板第一条</div>
  </div>
  <div class="cp-edit">
    <textarea id="clipInput" placeholder="输入文字，回车后自动加入粘贴板" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  </div>
  <div class="cp-list" id="clipList"></div>
  <div class="cp-empty" id="clipEmpty">暂无内容 — 远程 Ctrl+C 或本地复制后自动收录</div>
</div>

<!-- 分辨率菜单 -->
<div id="resMenu"></div>

<!-- 截图预览弹窗 -->
<div id="shotModal">
  <div class="shot-box"><img id="shotImg" alt="截图预览"></div>
  <div class="shot-actions">
    <button id="btnShotSave" class="primary">保存到公共区</button>
    <button id="btnShotDownload">下载 PNG</button>
    <button id="btnShotClose">关闭</button>
  </div>
</div>

<!-- 关闭桌面确认弹窗 -->
<div id="closeModal">
  <div class="close-box">
    <div class="close-title">关闭远程桌面</div>
    <div class="close-desc">确定要关闭远程桌面吗？关闭后当前连接将断开，已保存的文件不受影响。</div>
    <div class="close-actions">
      <button id="btnCloseCancel">取消</button>
      <button id="btnCloseConfirm" class="danger">确认关闭</button>
    </div>
  </div>
</div>

<input id="kbInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<div id="toast"></div>

<script type="module">
  import RFB from '/api/qwenpaw-desktop/novnc/core/rfb.js';

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status');
  const toastEl = $('toast');
  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 3500);
  }

  // ---- 连接（同源 WS 转发路由） ----
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const host = location.hostname;
  const port = location.port;
  const wsUrl = proto + '://' + host + (port ? ':' + port : '') + '/api/qwenpaw-desktop/vnc';
  const rfb = new RFB($('screen'), wsUrl, {});

  rfb.addEventListener('connect', () => {
    statusEl.textContent = '已连接';
    statusEl.classList.add('on');
    // 连接成功后自动聚焦输入（桌面端物理键盘直接可用）
    rfb.focusInput();
  });
  rfb.addEventListener('disconnect', (e) => {
    statusEl.textContent = '已断开' + (e.detail && e.detail.clean ? '' : '（重连中…）');
    statusEl.classList.remove('on');
    if (!(e.detail && e.detail.clean)) {
      setTimeout(() => location.reload(), 2500);
    }
  });
  rfb.addEventListener('securityfailure', (e) => {
    statusEl.textContent = '连接失败';
    toast('VNC 连接失败: ' + (e.detail && e.detail.reason || ''));
  });
  rfb.scaleViewport = true;
  rfb.resizeSession = false;

  // ---- 粘贴板（双向剪贴板暂存，X11 CLIPBOARD + xclip，UTF-8） ----
  // 交互：
  //   - 远程 Ctrl+C → 条目进粘贴板（不再自动覆盖本地剪贴板），点击条目复制到本地
  //   - 本地复制 → 自动读入粘贴板，点击条目或按 Ctrl+V 填入远程（写远程+自动粘贴）
  //   - 重复数据检测：相同文本只保留一条（自动移到顶部）
  const clipItems = [];            // { text, src: 'remote'|'local' }
  const MAX_CLIP = 10;
  let lastRemoteClip = null;       // 远程剪贴板变化检测
  let lastLocalClip = null;        // 本地剪贴板变化检测
  let localWriteTs = 0;            // 程序写入本地剪贴板的时间戳（防回读循环）
  let localWriteText = '';

  function pushClipItem(text, src) {
    if (!text || !text.trim()) return;
    text = text.trim();
    const idx = clipItems.findIndex(it => it.text === text);
    if (idx >= 0) clipItems.splice(idx, 1);   // 去重：相同文本移除旧位再置顶
    clipItems.unshift({ text, src });
    if (clipItems.length > MAX_CLIP) clipItems.length = MAX_CLIP;
    renderClipList();
  }

  function renderClipList() {
    const list = $('clipList');
    list.innerHTML = '';
    clipItems.forEach(it => {
      const d = document.createElement('div');
      d.className = 'cp-item';
      const tag = document.createElement('span');
      tag.className = 'cp-src ' + it.src;
      tag.textContent = it.src === 'remote' ? '⇠ 远端' : '⇢ 本地';
      const t = document.createElement('span');
      t.className = 'cp-text';
      t.textContent = it.text.length > 80 ? it.text.slice(0, 80) + '…' : it.text;
      d.title = it.text;
      d.appendChild(tag);
      d.appendChild(t);
      d.addEventListener('click', () => onClipItemClick(it));
      list.appendChild(d);
    });
    $('clipEmpty').style.display = clipItems.length ? 'none' : 'block';
  }

  function copyToLocalClipboard(text) {
    return new Promise((resolve) => {
      const ok = () => { localWriteTs = Date.now(); localWriteText = text; lastLocalClip = text; resolve(true); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(() => fallbackCopy(text, ok));
      } else {
        fallbackCopy(text, ok);
      }
    });
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }

  async function sendToRemote(text) {
    try {
      const r = await fetch('/api/qwenpaw-desktop/clipboard/write', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || ('HTTP ' + r.status));
      toast('已粘贴到远程桌面');
    } catch (e) {
      toast('粘贴失败: ' + e.message);
    }
  }

  async function onClipItemClick(it) {
    // 点击条目：统一复制到本地剪贴板，并移动到粘贴板第一条
    const idx = clipItems.indexOf(it);
    if (idx > 0) {
      clipItems.splice(idx, 1);
      clipItems.unshift(it);
      renderClipList();
    }
    const ok = await copyToLocalClipboard(it.text);
    toast(ok ? '已复制到本地剪贴板' : '写入本地剪贴板失败');
  }

  // 📋 面板展开/收起
  let clipOpen = false;
  $('btnPaste').addEventListener('click', () => {
    clipOpen = !clipOpen;
    $('clipPanel').style.display = clipOpen ? 'flex' : 'none';
    $('btnPaste').classList.toggle('active', clipOpen);
    if (clipOpen) renderClipList();
  });

  // 输入框：Enter 加入粘贴板（不直接发送）；Shift+Enter 换行
  $('clipInput').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;   // Shift+Enter 换行
    e.preventDefault();
    const text = $('clipInput').value.trim();
    if (!text) return;
    pushClipItem(text, 'local');
    $('clipInput').value = '';
  });

  // Ctrl+V：面板打开时自动填入第一条（最新条目）到远程，不分来源
  // 用 capture 阶段监听：VNC 画布有焦点时 noVNC 会在 canvas 上 stopPropagation，
  // 冒泡阶段收不到；capture 在事件到达 canvas 前拦截，同时阻止 noVNC 转发远程（防双粘贴）
  document.addEventListener('keydown', (e) => {
    if (!clipOpen) return;
    if (!(e.ctrlKey || e.metaKey) || (e.key || '').toLowerCase() !== 'v') return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    e.preventDefault();
    e.stopPropagation();
    if (!clipItems.length) { toast('粘贴板为空'); return; }
    const first = clipItems[0];
    sendToRemote(first.text);
  }, true);

  // 远程剪贴板轮询：Ctrl+C → 条目进粘贴板（不自动写本地）
  var pollClipboard = function () {
    fetch('/api/qwenpaw-desktop/clipboard/read').then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) return;
        var text = j.text || '';
        if (text && text !== lastRemoteClip) {
          lastRemoteClip = text;
          pushClipItem(text, 'remote');
        }
      })
      .catch(function () { /* 忽略轮询错误 */ });
  };

  // 本地剪贴板轮询：复制 → 自动读入粘贴板
  var pollLocalClip = async function () {
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) return;
      const text = await navigator.clipboard.readText();
      if (!text) return;
      // 跳过"点击远端条目写入本地"后的回读（2s 内相同文本）
      if (Date.now() - localWriteTs < 2000 && text === localWriteText) return;
      if (text !== lastLocalClip) {
        lastLocalClip = text;
        pushClipItem(text, 'local');
      }
    } catch (e) { /* 无权限/非安全上下文：静默，本地条目不可用 */ }
  };

  setTimeout(pollClipboard, 1500);
  setInterval(pollClipboard, 1500);
  setTimeout(pollLocalClip, 800);
  setInterval(pollLocalClip, 1500);

  // ---- 📷 截图 ----
  const shotModal = $('shotModal');
  const shotImg = $('shotImg');
  let shotUrl = null;
  $('btnShot').addEventListener('click', async () => {
    try {
      toast('正在截图…');
      const r = await fetch('/api/qwenpaw-desktop/screenshot');
      if (!r.ok) {
        const t = await r.text();
        throw new Error(t || ('HTTP ' + r.status));
      }
      const blob = await r.blob();
      if (shotUrl) URL.revokeObjectURL(shotUrl);
      shotUrl = URL.createObjectURL(blob);
      shotImg.src = shotUrl;
      shotModal.style.display = 'flex';
      toast('');
    } catch (e) {
      toast('截图失败: ' + e.message);
    }
  });
  $('btnShotSave').addEventListener('click', async () => {
    try {
      const r = await fetch('/api/qwenpaw-desktop/screenshot/save', { method: 'POST' });
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || j.detail || ('HTTP ' + r.status));
      toast('已保存: ' + j.path);
      shotModal.style.display = 'none';
    } catch (e) {
      toast('保存失败: ' + e.message);
    }
  });
  $('btnShotDownload').addEventListener('click', () => {
    if (!shotUrl) return;
    const a = document.createElement('a');
    a.href = shotUrl;
    a.download = 'desktop-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  $('btnShotClose').addEventListener('click', () => { shotModal.style.display = 'none'; });
  shotModal.addEventListener('click', (e) => {
    if (e.target === shotModal) shotModal.style.display = 'none';
  });

  // ---- 🖥 分辨率切换 ----
  const resMenu = $('resMenu');
  let resLoaded = false;
  async function renderResMenu() {
    if (resLoaded) return;
    try {
      const r = await fetch('/api/qwenpaw-desktop/resolutions');
      const j = await r.json();
      if (!r.ok || !j.ok) throw new Error(j.error || j.detail || ('HTTP ' + r.status));
      resLoaded = true;
      const cur = (j.current || '').split('x')[0] + 'x' + (j.current || '').split('x')[1];
      resMenu.innerHTML = '';
      (j.presets || []).forEach((p) => {
        const label = p.label + ' (' + (p.width * p.height / 1000000).toFixed(1) + 'MP)';
        const item = document.createElement('div');
        item.className = 'res-item' + (p.label === cur ? ' cur' : '');
        item.innerHTML = '<span class="mark">' + (p.label === cur ? '✓' : '') + '</span>' +
          '<span class="res-label">' + label + '</span>';
        item.addEventListener('click', async () => {
          resMenu.style.display = 'none';
          try {
            const rr = await fetch('/api/qwenpaw-desktop/resolution', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ width: p.width, height: p.height }),
            });
            const jj = await rr.json();
            if (!rr.ok || !jj.ok) throw new Error(jj.error || jj.detail || ('HTTP ' + rr.status));
            toast(jj.message + '，正在重连…');
            setTimeout(() => location.reload(), 1500);
          } catch (e) {
            toast('分辨率切换失败: ' + e.message);
          }
        });
        resMenu.appendChild(item);
      });
    } catch (e) {
      toast('分辨率列表加载失败: ' + e.message);
    }
  }
  $('btnRes').addEventListener('click', () => {
    const show = resMenu.style.display !== 'flex';
    resMenu.style.display = show ? 'flex' : 'none';
    if (show) renderResMenu();
  });
  document.addEventListener('mousedown', (e) => {
    if (resMenu.style.display === 'flex' && !resMenu.contains(e.target) && e.target.id !== 'btnRes') {
      resMenu.style.display = 'none';
    }
  }, true);

  // ---- 键盘：桌面端物理键盘 & 移动端系统软键盘 ----
  const kbInput = $('kbInput');
  // 点击画面时聚焦隐藏输入框（桌面端捕获物理键盘；移动端点击唤起系统软键盘）
  document.addEventListener('mousedown', () => { rfb.focusInput(); }, true);
  document.addEventListener('touchstart', () => { kbInput.focus(); }, { passive: true });

  // ---- 快捷入口 ----
  const dock = $('dock');
  document.querySelectorAll('.sc').forEach((el) => {
    el.addEventListener('click', async () => {
      const app = el.dataset.app;
      let ok = false, msg = '';
      try {
        if (app.startsWith('http')) {
          const r = await fetch('/api/qwenpaw-desktop/open', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: app }),
          });
          const j = await r.json();
          ok = j.ok; msg = j.error || '';
        } else {
          const name = app === '__terminal__' ? 'terminal' : 'files';
          const r = await fetch('/api/qwenpaw-desktop/launch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ app: name }),
          });
          const j = await r.json();
          ok = j.ok; msg = j.error || '';
        }
      } catch (e) { msg = String(e); }
      if (ok) {
        toast('已在桌面打开');
        dock.style.display = 'none'; // 打开后收起快捷层，专注桌面
      } else {
        toast('打开失败: ' + (msg || '未知错误'));
      }
    });
  });
  $('btnDock').addEventListener('click', () => {
    dock.style.display = dock.style.display === 'none' ? 'flex' : 'none';
  });

  // ---- 重连 / 关闭 ----
  $('btnReload').addEventListener('click', () => location.reload());
  // ⏻ 关闭：自定义确认弹窗（适配主题）
  $('btnClose').addEventListener('click', () => {
    $('closeModal').style.display = 'flex';
  });
  $('btnCloseCancel').addEventListener('click', () => {
    $('closeModal').style.display = 'none';
  });
  $('btnCloseConfirm').addEventListener('click', async () => {
    try {
      const r = await fetch('/api/qwenpaw-desktop/close', { method: 'POST' });
      const j = await r.json();
      toast(j.message || '桌面已关闭');
      $('closeModal').style.display = 'none';
      setTimeout(() => location.reload(), 1200);
    } catch (e) {
      toast(String(e));
      $('closeModal').style.display = 'none';
    }
  });
  // 点击遮罩关闭
  $('closeModal').addEventListener('click', (e) => {
    if (e.target === $('closeModal')) $('closeModal').style.display = 'none';
  });

  // 防止 iframe 内拖拽选择
  document.addEventListener('selectstart', (e) => e.preventDefault());

  // 平台入口下工具按钮位于外部底部栏：仅独立访问本页时显示工具栏
  if (window.self === window.top) {
    $('tools').style.display = 'flex';
  } else {
    // iframe 内无工具栏，快捷入口层/粘贴板面板贴底下移（不再避让工具栏）
    $('dock').style.bottom = '10px';
    $('clipPanel').style.bottom = '10px';
  }
  // 外部底部栏图标按钮 → 触发对应功能
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.source !== 'qwenpaw-desktop-outer' || !d.action) return;
    const map = { dock: 'btnDock', res: 'btnRes', shot: 'btnShot', paste: 'btnPaste' };
    const b = $(map[d.action]);
    if (b) b.click();
  });
</script>
</body>
</html>
